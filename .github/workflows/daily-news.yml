name: Daily News Digest

on:
  schedule:
    # 01:00 UTC = 06:30 AM IST
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Generate HTML digest
        run: python scripts/generate_html.py

      - name: Screenshot digest
        run: python scripts/screenshot.py

      - name: Commit and push updated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json docs/index.html
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update daily news digest [skip ci]"
          git push

      - name: Send digest to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
        run: python scripts/send_telegram.py
